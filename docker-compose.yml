version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: meditrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meditrack
      POSTGRES_PASSWORD: meditrack
      POSTGRES_DB: meditrack
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: meditrack-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  pg_data: